name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic:
    name: Basic CI (lightweight, always passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Basic validation
        run: |
          echo "Running basic CI checks..."
          echo "Repo: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          # Lightweight checks only - no heavy builds that block contributions
          # Format check (allow failure, just report)
          if command -v cargo >/dev/null 2>&1; then
            cargo fmt --all -- --check || echo "cargo fmt hint: formatting can be fixed later"
          fi
          echo "Basic CI passed :heart:"
