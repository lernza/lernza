[package]
rust-version = "1.80.0"
name = "milestone"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "22"
common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
quest = { path = "../quest" }
certificate = { path = "../certificate" }
proptest = "1"
testutils = { path = "../testutils" }

[features]
testutils = []
