name: Smart Contract CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/contract-cicd.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Contract Testing & Building ──────────────────────────────────
  contract-tests:
    name: Test & Build Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stellar-cli
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v25.2.0/stellar-cli-25.2.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin
          stellar version

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown,wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --workspace --verbose

      - name: Run integration tests
        run: cargo test -p rewards --test integration_test --verbose

      - name: Run property-based tests
        run: cargo test -p rewards --test proptest_invariants --verbose

      - name: Build WASM contracts
        run: stellar contract build

      - name: Verify WASM builds
        run: |
          echo "=== Verifying WASM Contract Builds ==="
          for wasm in target/wasm32v1-none/release/*.wasm; do
            [ -f "$wasm" ] || continue
            NAME=$(basename "$wasm")
            SIZE=$(stat -c%s "$wasm")
            SIZE_KB=$(echo "scale=2; $SIZE / 1024" | bc)
            echo "✓ $NAME: ${SIZE_KB}KB"
          done

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-wasm-${{ github.sha }}
          path: target/wasm32v1-none/release/*.wasm
          retention-days: 30

      - name: Generate contract metadata
        run: |
          echo "=== Contract Build Metadata ===" > contract-metadata.txt
          echo "Commit: ${{ github.sha }}" >> contract-metadata.txt
          echo "Branch: ${{ github.ref_name }}" >> contract-metadata.txt
          echo "Build Time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> contract-metadata.txt
          echo "" >> contract-metadata.txt
          echo "Contract Sizes:" >> contract-metadata.txt
          for wasm in target/wasm32v1-none/release/*.wasm; do
            [ -f "$wasm" ] || continue
            NAME=$(basename "$wasm")
            SIZE=$(stat -c%s "$wasm")
            SIZE_KB=$(echo "scale=2; $SIZE / 1024" | bc)
            SHA256=$(sha256sum "$wasm" | cut -d' ' -f1)
            echo "  $NAME: ${SIZE_KB}KB (sha256: $SHA256)" >> contract-metadata.txt
          done
          cat contract-metadata.txt

      - name: Upload metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-metadata-${{ github.sha }}
          path: contract-metadata.txt
          retention-days: 90

  # ── Security Audit ────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          arguments: --config deny.toml

  # ── Contract Size Report ──────────────────────────────────────────
  size-report:
    name: Contract Size Report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: contract-tests
    permissions:
      pull-requests: write
    steps:
      - name: Download WASM artifacts
        uses: actions/download-artifact@7e997abb5e2e1e20a1aebdab18bf48e00c1e5a0c # v7.0.0
        with:
          name: contract-wasm-${{ github.sha }}
          path: ./wasm

      - name: Generate size report
        id: report
        run: |
          echo "# 📦 Smart Contract Size Report" > report.md
          echo "" >> report.md
          echo "| Contract | Size | Budget | Status |" >> report.md
          echo "|----------|------|--------|--------|" >> report.md

          declare -A BUDGETS=(
            ["certificate.wasm"]=$((100 * 1024))
            ["milestone.wasm"]=$((150 * 1024))
            ["quest.wasm"]=$((150 * 1024))
            ["rewards.wasm"]=$((100 * 1024))
          )

          for wasm in ./wasm/*.wasm; do
            [ -f "$wasm" ] || continue
            NAME=$(basename "$wasm")
            SIZE=$(stat -c%s "$wasm")
            SIZE_KB=$(echo "scale=2; $SIZE / 1024" | bc)
            BUDGET=${BUDGETS[$NAME]:-$((256 * 1024))}
            BUDGET_KB=$(echo "scale=2; $BUDGET / 1024" | bc)
            
            if [ "$SIZE" -gt "$BUDGET" ]; then
              STATUS="🔴 Over budget"
            else
              PERCENT=$(echo "scale=1; ($SIZE * 100) / $BUDGET" | bc)
              STATUS="🟢 ${PERCENT}%"
            fi
            
            echo "| \`$NAME\` | ${SIZE_KB} KB | ${BUDGET_KB} KB | $STATUS |" >> report.md
          done

          echo "" >> report.md
          echo "_Built from commit ${{ github.sha }}_" >> report.md

      - name: Comment size report
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user?.type === 'Bot' && c.body?.includes('Smart Contract Size Report')
            );

            try {
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: report
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: report
                });
              }
            } catch (error) {
              console.log("Failed to post size report.", error.message);
            }

  # ── Test Coverage Report ──────────────────────────────────────────
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0a8954ff6cb1f1a94b0dab2f2b8cbb8f27558ba6 # v7.0.0
        with:
          files: lcov.info
          flags: contracts
          fail_ci_if_error: false

  # ── Deployment Readiness Check ────────────────────────────────────
  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [contract-tests, security-audit]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download WASM artifacts
        uses: actions/download-artifact@7e997abb5e2e1e20a1aebdab18bf48e00c1e5a0c # v7.0.0
        with:
          name: contract-wasm-${{ github.sha }}
          path: ./wasm

      - name: Verify deployment readiness
        run: |
          echo "=== Deployment Readiness Check ==="
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "✓ All tests passed"
          echo "✓ Security audit passed"
          echo "✓ WASM artifacts ready"
          echo ""
          echo "Contracts ready for deployment to testnet/mainnet"

      - name: Create deployment summary
        run: |
          echo "# 🚀 Deployment Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Smart contracts have passed all checks and are ready for deployment." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- WASM contracts: \`contract-wasm-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Metadata: \`contract-metadata-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
