name: Dependency Security & Lockfile Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-security-scan.yml'
  push:
    branches: [main]
  schedule:
    # Daily security scan at 00:00 UTC
    - cron: '0 0 * * *'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-security-audit:
    name: Cargo Vulnerability & Deny Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit cargo-deny --locked

      - name: Validate Cargo.lock Integrity
        run: |
          cargo check --locked --workspace

      - name: Run Cargo Audit
        run: |
          cargo audit --deny warnings --deny unmaintained --deny unsound --deny yanked

      - name: Run Cargo Deny Policy Check
        run: |
          cargo deny check --config deny.toml

  frontend-security-audit:
    name: Frontend Package Audit & Lockfile Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Validate pnpm-lock.yaml Frozen Lockfile
        working-directory: ./frontend
        run: |
          pnpm install --frozen-lockfile

      - name: Run pnpm Security Audit
        working-directory: ./frontend
        run: |
          # Audit dependencies and fail on high or critical vulnerabilities
          pnpm audit --audit-level high
